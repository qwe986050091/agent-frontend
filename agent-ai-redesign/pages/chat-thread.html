    <style id="theme-vars">
/* ============================================================
   Agent AI 对话助手 — 精致日系立绘品牌规范
   干净透亮的蓝白界面 × 粉发立绘：蓝粉相映、高明度、低饱和
   prefix: agent
   ============================================================ */

:root {
  /* ---- 品牌主色（单一主色相：晴空蓝） ---- */
  --agent-primary-50:  #eef4ff;
  --agent-primary-100: #dce8ff;
  --agent-primary-200: #bfd4ff;
  --agent-primary-300: #93b6ff;
  --agent-primary-400: #6a97ff;
  --agent-primary-500: #4d86ff;   /* 品牌主色 */
  --agent-primary-600: #3b6ff6;   /* hover / 强调 */
  --agent-primary-700: #2f59d6;
  --agent-primary-800: #2949ab;
  --agent-primary-900: #263f87;

  /* ---- 中性墨色（偏冷的深蓝灰，不用纯黑） ---- */
  --agent-ink-900: #141c2b;
  --agent-ink-800: #1d2738;
  --agent-ink-700: #2c384c;
  --agent-ink-600: #44506a;
  --agent-ink-500: #5f6c84;
  --agent-ink-400: #8590a6;
  --agent-ink-300: #aab3c5;
  --agent-ink-200: #d3dae7;
  --agent-ink-100: #e7ecf4;

  /* ---- 语义状态色（仅用于状态，不参与品牌/分类） ---- */
  --state-success: #18b279;
  --state-warning: #f0a028;
  --state-error:   #ef4d6d;
  --state-info:    #4d86ff;

  /* 角色点缀色（粉发立绘呼应，仅用于桌宠/角色相关，不做大面积品牌色） */
  --agent-pet-pink: #f17cad;
  --agent-pet-mint: #2fc4a8;

  /* ============ 语义别名（Tailwind 桥接） ============ */
  --agent-background:        #f6f9ff;
  --agent-foreground:        #1d2738;
  --agent-card:              #ffffff;
  --agent-card-foreground:   #1d2738;
  --agent-popover:           #ffffff;
  --agent-popover-foreground:#1d2738;
  --agent-primary:           #4d86ff;
  --agent-primary-foreground:#ffffff;
  --agent-muted:             #eef3fc;
  --agent-muted-foreground:  #5f6c84;
  --agent-border:            #e4ebf7;
  --agent-input:             #d9e2f2;
  --agent-ring:              #4d86ff;

  /* 侧边栏 */
  --agent-sidebar:                  #fbfdff;
  --agent-sidebar-foreground:       #2c384c;
  --agent-sidebar-primary:          #4d86ff;
  --agent-sidebar-primary-foreground:#ffffff;
  --agent-sidebar-accent:           #eef4ff;
  --agent-sidebar-accent-foreground:#2f59d6;

  /* ---- 圆角（克制，最大 16px） ---- */
  --agent-radius-sm: 4px;
  --agent-radius-md: 8px;
  --agent-radius-lg: 16px;
  --agent-radius-full: 9999px;

  /* ---- 字体 ---- */
  --agent-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --agent-font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  /* ---- 阴影（静态面 alpha <= 0.05；浮层可更深） ---- */
  --agent-shadow-card: 0 1px 2px rgba(23, 43, 92, 0.04), 0 8px 24px rgba(23, 43, 92, 0.05);
  --agent-shadow-pop:  0 12px 40px rgba(23, 43, 92, 0.14);
  --agent-shadow-glow: 0 8px 28px rgba(77, 134, 255, 0.22);
}

/* ============ 暗色模式（预留） ============ */
.dark {
  --agent-background:        #0e1626;
  --agent-foreground:        #e8eefb;
  --agent-card:              #16203a;
  --agent-card-foreground:   #e8eefb;
  --agent-popover:           #16203a;
  --agent-popover-foreground:#e8eefb;
  --agent-primary:           #6a97ff;
  --agent-primary-foreground:#0b1120;
  --agent-muted:             #1d2942;
  --agent-muted-foreground:  #93a0bd;
  --agent-border:            #263357;
  --agent-input:             #2f3d63;
  --agent-ring:              #6a97ff;
  --agent-sidebar:                  #111b30;
  --agent-sidebar-foreground:       #c6d0e6;
  --agent-sidebar-primary:          #6a97ff;
  --agent-sidebar-primary-foreground:#0b1120;
  --agent-sidebar-accent:           #1d2942;
  --agent-sidebar-accent-foreground:#bcd2ff;
}

/* ============ 基础排版 ============ */
html, body {
  font-family: var(--agent-font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.font-display { font-family: var(--agent-font-display); letter-spacing: -0.01em; }

.glass-card {
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow: var(--agent-shadow-card);
}

.text-gradient {
  background: linear-gradient(120deg, #2f59d6 0%, #4d86ff 45%, #6a97ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

@keyframes softFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
.animate-soft-float { animation: softFloat 6s ease-in-out infinite; }

<body class="min-h-screen font-sans antialiased">

        </div>
        <div class="px-3">

        <div class="border-t border-border p-3">

    <style>
      #desk-pet { position: fixed; z-index: 60; right: 22px; bottom: 16px; width: 132px; display:flex; flex-direction:column; align-items:flex-end; user-select:none; -webkit-user-select:none; }
      #desk-pet .pet-figure { position: relative; width: 132px; cursor: pointer; }
      #desk-pet img.pet-img { width:132px; height:auto; display:block; -webkit-user-drag:none; mix-blend-mode:multiply; filter:drop-shadow(0 12px 16px rgba(23,43,92,.16)); animation:petBob 3.6s ease-in-out infinite; transform-origin:50% 88%; transition:transform .15s ease; }
      #desk-pet .pet-figure:hover img.pet-img { transform:translateY(-3px) scale(1.03); }
      @keyframes petBob { 0%,100%{transform:translateY(0) rotate(-1.6deg);} 50%{transform:translateY(-7px) rotate(1.6deg);} }
      #desk-pet.pet-idle img.pet-img { animation:petDoze 4.6s ease-in-out infinite; filter:drop-shadow(0 10px 14px rgba(23,43,92,.13)) saturate(.9); }
      @keyframes petDoze { 0%,100%{transform:translateY(1px) rotate(-3.2deg) scale(.985);} 50%{transform:translateY(-2px) rotate(3.2deg) scale(.985);} }
      #pet-zzz { position:absolute; top:-10px; right:-6px; width:30px; height:34px; display:none; pointer-events:none; }
      #desk-pet.pet-idle #pet-zzz { display:block; }
      #pet-zzz span { position:absolute; left:0; bottom:0; font-weight:800; color:var(--agent-primary,#4d86ff); opacity:0; animation:zzzFloat 2.7s ease-in-out infinite; text-shadow:0 1px 2px rgba(255,255,255,.9); }
      #pet-zzz span:nth-child(1){font-size:11px;animation-delay:0s;}
      #pet-zzz span:nth-child(2){font-size:14px;left:8px;animation-delay:.9s;}
      #pet-zzz span:nth-child(3){font-size:17px;left:15px;animation-delay:1.8s;}
      @keyframes zzzFloat { 0%{opacity:0;transform:translateY(7px) scale(.6);} 30%{opacity:.95;} 100%{opacity:0;transform:translateY(-20px) translateX(7px) scale(1.1);} }
      #desk-pet img.pet-img.jumping { animation:petJump .65s cubic-bezier(.34,1.56,.64,1); }
      @keyframes petJump { 0%{transform:translateY(0) scale(1,1);} 20%{transform:translateY(7px) scale(1.1,.84);} 42%{transform:translateY(-30px) scale(.95,1.07);} 68%{transform:translateY(0) scale(1.08,.9);} 84%{transform:translateY(-5px) scale(.99,1.02);} 100%{transform:translateY(0) scale(1,1);} }
      .pet-fx { position:absolute; inset:0; pointer-events:none; overflow:visible; }
      .pet-spark { position:absolute; pointer-events:none; animation:sparkFly .95s ease-out forwards; }
      .pet-spark svg { width:16px; height:16px; display:block; }
      @keyframes sparkFly { 0%{opacity:0;transform:translateY(4px) scale(.4) rotate(0);} 25%{opacity:1;} 100%{opacity:0;transform:translateY(-34px) scale(1.15) rotate(28deg);} }
      #pet-bubble { position:relative; width:216px; margin-bottom:10px; padding:10px 14px; border-radius:16px; font-size:13px; line-height:1.6; color:var(--agent-ink-800,#22304a); background:rgba(255,255,255,.92); border:1px solid var(--agent-border,#e4ebf7); box-shadow:0 8px 24px rgba(23,43,92,.1); opacity:0; transform:translateY(6px); pointer-events:none; transition:opacity .3s ease, transform .3s ease; }
      #pet-bubble.show { opacity:1; transform:translateY(0); }
      #pet-bubble::after { content:''; position:absolute; bottom:-6px; right:32px; width:12px; height:12px; background:rgba(255,255,255,.92); border-right:1px solid var(--agent-border,#e4ebf7); border-bottom:1px solid var(--agent-border,#e4ebf7); transform:rotate(45deg); }
    </style>
    <div id="desk-pet">
      <div id="pet-bubble"><span id="pet-bubble-text">嗨～我是你的小助手！</span></div>
      <div class="pet-figure" id="pet-figure" title="点我摸摸头">
        <div class="pet-fx" id="pet-fx"></div>
        <div id="pet-zzz" aria-hidden="true"><span>z</span><span>Z</span><span>Z</span></div>
        <img class="pet-img" src="../assets/pet-mascot.jpg" alt="桌宠小助手" draggable="false" />
      </div>
    </div>
    <script>
    (function () {
      var pet = document.getElementById('desk-pet'); if (!pet) return;
      var fig = document.getElementById('pet-figure');
      var bubble = document.getElementById('pet-bubble');
      var text = document.getElementById('pet-bubble-text');
      var fx = document.getElementById('pet-fx');
      var IDLE_MS = 20000, lastActive = Date.now(), idle = false, timer = null;
      var lines = ['嗨～今天也要元气满满哦！','有什么想问的，尽管戳我啦～','啦啦啦～我就在这儿陪着你','写累了？喝口水再继续嘛','知识库和技能都备好啦，随时开工！','嘿嘿，被你发现啦','今天的你也超厉害的！','需要我帮忙的时候，点我一下就好～'];
      var patLines = ['嘿嘿，摸摸头好舒服～','再多摸一下嘛','开心！给你比个心','哇，被宠爱了呢','最喜欢和你待在一起啦'];
      var wakeLines = ['唔…我刚刚打了个小盹儿','你回来啦！我还以为你走丢了呢','呼…睡饱啦，继续加油！','啊呜…被你叫醒啦～'];
      var HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
      var STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.3L20 10l-6.1 1.7L12 18l-1.9-6.3L4 10l6.1-1.7z"/></svg>';
      function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
      function showBubble(msg, hold){ text.textContent = msg; bubble.classList.add('show'); clearTimeout(timer); timer = setTimeout(function(){ bubble.classList.remove('show'); }, hold||4200); }
      function spawn(){ for (var i=0;i<4;i++){ var s=document.createElement('span'); var heart=(i%2===0); s.className='pet-spark'; s.innerHTML = heart?HEART:STAR; s.style.color = heart?'var(--agent-pet-pink,#f17cad)':'var(--agent-primary,#4d86ff)'; s.style.left=(26+Math.random()*62)+'px'; s.style.top=(14+Math.random()*30)+'px'; s.style.animationDelay=(Math.random()*0.12)+'s'; fx.appendChild(s); (function(el){ setTimeout(function(){ el.remove(); },1050); })(s); } }
      function pat(){ var wasIdle = idle; lastActive = Date.now(); idle = false; pet.classList.remove('pet-idle'); spawn(); var pimg = pet.querySelector('img.pet-img'); pimg.classList.remove('jumping'); void pimg.offsetWidth; pimg.classList.add('jumping'); setTimeout(function(){ pimg.classList.remove('jumping'); },680); showBubble(wasIdle?pick(wakeLines):(Math.random()<0.55?pick(patLines):pick(lines))); }
      fig.addEventListener('click', pat);
      window.addEventListener('mousemove', function(){ lastActive = Date.now(); }, { passive:true });
      window.addEventListener('keydown', function(){ lastActive = Date.now(); }, { passive:true });
      setInterval(function(){ var isIdle = (Date.now()-lastActive) > IDLE_MS; if (isIdle !== idle){ idle = isIdle; pet.classList.toggle('pet-idle', isIdle); } }, 1000);
      setTimeout(function(){ showBubble('嗨～我是你的小助手！点我一下可以摸摸头，不理我我会偷偷打盹哦', 5600); }, 1200);
    })();
    </script>
